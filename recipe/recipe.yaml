schema_version: 1

context:
  name: storage3
  version: "2.33.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7b5a27ca1e64e324420ca9514c38317f243a0ae7a56aeef336976034c1c565d4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.3,<0.9.0
  run:
    - python >=${{ python_min }}
    - httpx >=0.26,<0.29
    - deprecation >=2.1.0
    - pydantic >=2.11.7,<3
    - yarl >=1.20.1
    - pyiceberg >=0.10.0

tests:
  - python:
      imports:
        - storage3
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Python Client library to interact with Supabase Storage
  description: Python Client library to interact with Supabase Storage
  homepage: https://github.com/supabase/supabase-py/tree/main/src/storage

extra:
  recipe-maintainers:
    - timkpaine
    - J0
    - anand2312
